<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Çoklu AFK Bot Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        h1 { margin: 0; font-size: 1.5rem; color: #60a5fa; }
        .badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .main-layout { display: grid; grid-template-columns: 350px 1fr; gap: 25px; align-items: start; }
        @media(max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .card h3 { margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input, select { width: 100%; padding: 10px; margin: 6px 0; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.9rem; color: var(--text-muted); }
        .checkbox-group input { width: auto; margin: 0; }
        button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
        button:hover { background: var(--accent-hover); }
        button.stop { background: var(--danger); }
        button.stop:hover { background: #dc2626; }
        
        .bots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .bot-card { background: var(--card-bg); border-radius: 12px; padding: 18px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); position: relative; }
        .bot-card h4 { margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center; color: #60a5fa; font-size: 1.1rem; }
        .status-row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 0.85rem; background: rgba(255,255,255,0.03); padding: 5px 8px; border-radius: 4px; }
        .logs { background: #020617; border: 1px solid var(--border); padding: 8px; height: 110px; overflow-y: scroll; font-family: 'Courier New', Courier, monospace; font-size: 10px; border-radius: 6px; margin-top: 10px; }
        .status-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: #334155; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Minecraft Çoklu AFK Bot Paneli</h1>
        <div class="badge">Aktif Bot Sayısı: <span id="totalBotsCount" style="color: #60a5fa;">0</span></div>
    </header>

    <div class="main-layout">
        <!-- Sol Taraf: Yeni Bot Ekleme Formu -->
        <div class="card">
            <h3>Yeni Bot Oluştur</h3>
            <input type="text" id="botId" placeholder="Benzersiz Bot ID (Örn: bot1)" value="bot1">
            <input type="text" id="host" placeholder="Sunucu IP Adresi" value="localhost">
            <input type="text" id="port" placeholder="Sunucu Port" value="25565">
            <input type="text" id="username" placeholder="Bot Kullanıcı Adı" value="AFK_Bot_1">
            <input type="text" id="version" placeholder="Minecraft Sürümü (Boş = Otomatik)">
            <input type="text" id="loginCmd" placeholder="Login Komutu (Örn: /login 1234)">
            <input type="text" id="subServer" placeholder="Alt Sunucu Adı (/gir için)">
            
            <div class="checkbox-group">
                <input type="checkbox" id="autoReconnect" checked>
                <label for="autoReconnect">Oto Yeniden Bağlan</label>
            </div>

            <button onclick="startBot()">Botu Başlat & Ekle</button>
        </div>

        <!-- Sağ Taraf: Aktif Botların Kartları -->
        <div>
            <h2 style="margin-top: 0; font-size: 1.2rem; color: var(--text-muted);">Aktif Bot Kartları</h2>
            <div id="botsContainer" class="bots-grid">
                <p id="noBotsText" style="color: var(--text-muted); font-style: italic;">Şu anda çalışan bot bulunmuyor. Sol panelden bot ekleyin.</p>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const activeBots = {};

        function startBot() {
            const config = {
                id: document.getElementById('botId').value.trim(),
                host: document.getElementById('host').value.trim(),
                port: document.getElementById('port').value.trim(),
                username: document.getElementById('username').value.trim(),
                version: document.getElementById('version').value.trim(),
                loginCmd: document.getElementById('loginCmd').value.trim(),
                subServer: document.getElementById('subServer').value.trim(),
                autoReconnect: document.getElementById('autoReconnect').checked
            };

            if (!config.id || !config.username) {
                alert('Lütfen Bot ID ve Kullanıcı Adı alanlarını doldurun!');
                return;
            }

            // Kart daha önce yoksa arayüze dinamik kart ekle
            createBotCard(config.id);
            socket.emit('start-bot', config);
        }

        function stopBot(id) {
            socket.emit('stop-bot', id);
        }

        function createBotCard(id) {
            if (activeBots[id]) return; // Zaten varsa tekrar oluşturma
            activeBots[id] = true;

            document.getElementById('noBotsText').style.display = 'none';
            const container = document.getElementById('botsContainer');

            const cardHTML = `
                <div class="bot-card" id="card-${id}">
                    <h4>
                        <span>🤖 ${id}</span>
                        <span class="status-badge" id="status-${id}">Başlatılıyor</span>
                    </h4>
                    
                    <div class="status-row">
                        <span>Uptime:</span>
                        <strong id="uptime-${id}" style="color: #38bdf8;">0s 0d 0sn</strong>
                    </div>
                    <div class="status-row">
                        <span>Radar (X, Y, Z):</span>
                        <span id="radar-${id}">X: 0, Y: 0, Z: 0</span>
                    </div>
                    <div class="status-row">
                        <span>Scoreboard:</span>
                        <span id="score-${id}" style="color: #facc15;">Yok</span>
                    </div>

                    <div class="logs" id="logs-${id}"><div>[Sistem] Bağlantı hazırlanıyor...</div></div>
                    
                    <button class="stop" onclick="stopBot('${id}')">Botu Durdur</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        }

        function removeBotCard(id) {
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.remove();
                delete activeBots[id];
            }
            if (Object.keys(activeBots).length === 0) {
                document.getElementById('noBotsTest').style.display = 'block';
            }
        }

        // Socket Dinleyicileri
        socket.on('total-bots', (count) => {
            document.getElementById('totalBotsCount').innerText = count;
        });

        socket.on('bot-status', (data) => {
            createBotCard(data.id);
            const badge = document.getElementById(`status-${data.id}`);
            if (badge) {
                badge.innerText = data.status;
                badge.style.background = data.status === 'Oyunda' ? 'var(--success)' : (data.status === 'Bağlanıyor' ? '#eab308' : 'var(--danger)');
            }
            if (data.status === 'Durduruldu' || data.status === 'Bağlantı Kesildi ve Kapatıldı') {
                // İsteğe bağlı olarak kartı tamamen kaldırabilir veya durduruldu olarak bırakabilirsin
            }
        });

        socket.on('bot-log', (data) => {
            createBotCard(data.id);
            const logsBox = document.getElementById(`logs-${data.id}`);
            if (logsBox) {
                logsBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${data.message}</div>`;
                logsBox.scrollTop = logsBox.scrollHeight;
            }
        });

        socket.on('bot-radar', (data) => {
            const radarEl = document.getElementById(`radar-${data.id}`);
            if (radarEl) {
                radarEl.innerText = `X: ${data.position.x}, Y: ${data.position.y}, Z: ${data.position.z}`;
            }
        });

        socket.on('bot-scoreboard', (data) => {
            const scoreEl = document.getElementById(`score-${data.id}`);
            if (scoreEl) {
                scoreEl.innerText = data.scoreboard.title;
            }
        });

        socket.on('stats-update', (data) => {
            for (const id in data.bots) {
                if (activeBots[id]) {
                    const uptimeEl = document.getElementById(`uptime-${id}`);
                    if (uptimeEl) {
                        uptimeEl.innerText = data.bots[id].uptime;
                    }
                }
            }
        });
    </script>
</body>
</html>
