<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Çoklu AFK Bot Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.3rem; color: #60a5fa; }
        .badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; border: 1px solid #334155; }
        
        .btn-add { background: var(--success); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 10px; box-sizing: border-box; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; color: #60a5fa; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        input { width: 100%; padding: 10px; margin: 6px 0; background: #0b0f19; border: 1px solid var(--border); border-radius: 6px; color: var(--text); box-sizing: border-box; font-size: 0.9rem; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: 0.85rem; color: var(--text-muted); }
        .checkbox-group input { width: auto; margin: 0; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
        button.close-btn { background: #475569; }

        /* Bot Kartları */
        .bots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 15px; }
        .bot-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .bot-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
        .bot-header h4 { margin: 0; color: #60a5fa; font-size: 1rem; }
        .status-badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; background: #334155; }

        .info-row { display: flex; justify-content: space-between; margin: 5px 0; font-size: 0.8rem; background: rgba(255,255,255,0.02); padding: 5px 8px; border-radius: 4px; }
        
        /* Radar & Skorbord */
        .panels-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin: 10px 0; }
        .radar-box { background: #0b0f19; border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5px; }
        canvas { width: 110px; height: 110px; background: #020617; border-radius: 4px; }
        
        .scoreboard-box { background: #0b0f19; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 0.75rem; height: 120px; overflow-y: auto; }
        .scoreboard-title { color: #facc15; font-weight: bold; text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 2px; margin-bottom: 4px; }

        /* Tab ve Envanter Bölümleri */
        .section-title { font-size: 0.85rem; color: #60a5fa; margin: 10px 0 4px 0; font-weight: bold; border-top: 1px solid var(--border); padding-top: 6px; }
        .tab-list-box { background: #0b0f19; border: 1px solid var(--border); border-radius: 6px; padding: 6px; max-height: 100px; overflow-y: auto; font-size: 0.75rem; }
        .tab-row { display: flex; justify-content: space-between; padding: 2px 4px; border-bottom: 1px solid rgba(255,255,255,0.03); }

        .inventory-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: #0b0f19; padding: 4px; border-radius: 6px; border: 1px solid var(--border); margin-top: 5px; }
        .inv-slot { background: #1e293b; aspect-ratio: 1; border-radius: 2px; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #94a3b8; }

        /* Terminal */
        .logs { background: #020617; border: 1px solid var(--border); padding: 8px; height: 80px; overflow-y: scroll; font-family: monospace; font-size: 10px; border-radius: 6px; margin-top: 8px; }
        .terminal-input-group { display: flex; gap: 5px; margin-top: 6px; }
        .terminal-input-group input { margin: 0; font-size: 0.8rem; padding: 6px; }
        .terminal-input-group button { width: 70px; margin: 0; font-size: 0.8rem; padding: 6px; }
        button.stop { background: var(--danger); margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Minecraft AFK Paneli</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="badge">Bot: <span id="totalBotsCount" style="color: #60a5fa;">0</span></div>
            <button class="btn-add" onclick="openModal()">+ Yeni Bot Ekle</button>
        </div>
    </header>

    <!-- Modal -->
    <div class="modal" id="botModal">
        <div class="modal-content">
            <h3>⚙️ Yeni Bot Ayarları</h3>
            <input type="text" id="botId" placeholder="Bot ID (Örn: bot1)">
            <input type="text" id="host" placeholder="Sunucu IP Adresi" value="oyna.aesirmc.com">
            <input type="text" id="port" placeholder="Sunucu Port" value="25565">
            <input type="text" id="username" placeholder="Bot Kullanıcı Adı" value="AFK_Bot">
            <input type="text" id="version" placeholder="Sürüm (Örn: 1.20.4)" value="1.20.4">
            <input type="text" id="loginCmd" placeholder="Login Komutu (Örn: /login sifre)">
            <input type="text" id="subServer" placeholder="Alt Sunucu Adı (/gir için)">
            
            <div class="checkbox-group">
                <input type="checkbox" id="autoReconnect" checked>
                <label for="autoReconnect">Oto Yeniden Bağlan</label>
            </div>

            <div class="modal-buttons">
                <button class="close-btn" onclick="closeModal()">İptal</button>
                <button onclick="startBot()">Bağlan</button>
            </div>
        </div>
    </div>

    <div id="botsContainer" class="bots-grid">
        <p id="noBotsText" style="color: var(--text-muted); font-style: italic; text-align: center; grid-column: 1/-1; margin-top: 40px;">Henüz aktif bot yok. Sağ üstten ekleyin.</p>
    </div>

    <script>
        const socket = io();
        const activeBots = {};

        function openModal() { document.getElementById('botModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('botModal').style.display = 'none'; }

        function startBot() {
            const config = {
                id: document.getElementById('botId').value.trim(),
                host: document.getElementById('host').value.trim(),
                port: document.getElementById('port').value.trim(),
                username: document.getElementById('username').value.trim(),
                version: document.getElementById('version').value.trim(),
                loginCmd: document.getElementById('loginCmd').value.trim(),
                subServer: document.getElementById('subServer').value.trim(),
                autoReconnect: document.getElementById('autoReconnect').checked
            };

            if (!config.id || !config.username) {
                alert('Bot ID ve Kullanıcı Adı zorunludur!');
                return;
            }

            closeModal();
            createBotCard(config.id);
            socket.emit('start-bot', config);
        }

        function stopBot(id) { socket.emit('stop-bot', id); }

        function sendCommand(id) {
            const inputEl = document.getElementById(`cmd-input-${id}`);
            const command = inputEl.value.trim();
            if (command) {
                socket.emit('send-command', { id, command });
                inputEl.value = '';
            }
        }

        function createBotCard(id) {
            if (activeBots[id]) return;
            activeBots[id] = true;

            document.getElementById('noBotsText').style.display = 'none';
            const container = document.getElementById('botsContainer');

            const cardHTML = `
                <div class="bot-card" id="card-${id}">
                    <div class="bot-header">
                        <h4>🤖 ${id}</h4>
                        <span class="status-badge" id="status-${id}">Başlıyor</span>
                    </div>
                    
                    <div class="info-row">
                        <span>Uptime:</span>
                        <strong id="uptime-${id}" style="color: #38bdf8;">0s 0d 0sn</strong>
                    </div>
                    <div class="info-row">
                        <span>Koordinat:</span>
                        <span id="coords-${id}">X: 0, Y: 0, Z: 0</span>
                    </div>

                    <!-- Radar ve Skorbord -->
                    <div class="panels-row">
                        <div class="radar-box">
                            <span style="font-size: 9px; color: #94a3b8; margin-bottom: 2px;">RADAR</span>
                            <canvas id="radar-canvas-${id}" width="110" height="110"></canvas>
                        </div>
                        <div class="scoreboard-box">
                            <div class="scoreboard-title" id="score-title-${id}">Skorbord</div>
                            <div id="score-items-${id}" style="color: #cbd5e1;">Yükleniyor...</div>
                        </div>
                    </div>

                    <!-- Tab Oyuncu Listesi -->
                    <div class="section-title">Tab Oyuncu Listesi</div>
                    <div class="tab-list-box" id="tablist-${id}">
                        <div style="color: #64748b; text-align: center;">Yükleniyor...</div>
                    </div>

                    <!-- Bot Envanteri Görüntüleme -->
                    <div class="section-title">Bot Envanteri</div>
                    <div class="inventory-grid" id="inv-${id}">
                        ${Array.from({length: 27}, () => `<div class="inv-slot">-</div>`).join('')}
                    </div>

                    <div class="logs" id="logs-${id}"><div>[Sistem] Bağlantı başlatıldı...</div></div>
                    
                    <div class="terminal-input-group">
                        <input type="text" id="cmd-input-${id}" placeholder="/gir survival vb. komut yaz..." onkeydown="if(event.key==='Enter') sendCommand('${id}')">
                        <button onclick="sendCommand('${id}')">Gönder</button>
                    </div>

                    <button class="stop" onclick="stopBot('${id}')">Botu Durdur</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHTML);
        }

        function drawRadar(id, x, z, players) {
            const canvas = document.getElementById(`radar-canvas-${id}`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 110, 110);

            // Çizgiler
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(55, 0); ctx.lineTo(55, 110);
            ctx.moveTo(0, 55); ctx.lineTo(110, 55);
            ctx.stroke();

            // Bot (Yeşil merkez nokta)
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(55, 55, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Socket Dinleyicileri
        socket.on('total-bots', (count) => { document.getElementById('totalBotsCount').innerText = count; });

        socket.on('bot-status', (data) => {
            createBotCard(data.id);
            const badge = document.getElementById(`status-${data.id}`);
            if (badge) {
                badge.innerText = data.status;
                badge.style.background = data.status === 'Oyunda' ? 'var(--success)' : (data.status === 'Bağlanıyor' ? '#eab308' : 'var(--danger)');
            }
        });

        socket.on('bot-log', (data) => {
            createBotCard(data.id);
            const logsBox = document.getElementById(`logs-${data.id}`);
            if (logsBox) {
                logsBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${data.message}</div>`;
                logsBox.scrollTop = logsBox.scrollHeight;
            }
        });

        socket.on('bot-radar', (data) => {
            const coordEl = document.getElementById(`coords-${data.id}`);
            if (coordEl) {
                coordEl.innerText = `X: ${data.position.x}, Y: ${data.position.y}, Z: ${data.position.z}`;
                drawRadar(data.id, data.position.x, data.position.z, data.players);
            }
        });

        socket.on('bot-tablist', (data) => {
            const tabEl = document.getElementById(`tablist-${data.id}`);
            if (tabEl && data.tabList) {
                tabEl.innerHTML = data.tabList.map(p => `<div class="tab-row"><span>${p.name}</span><span style="color:#22c55e">${p.ping}ms</span></div>`).join('');
            }
        });

        socket.on('bot-inventory', (data) => {
            const invEl = document.getElementById(`inv-${data.id}`);
            if (invEl && data.inventory) {
                let html = '';
                for (let i = 9; i < 36; i++) { // Ana envanter slotları
                    const item = data.inventory[i];
                    html += `<div class="inv-slot" title="${item ? item.name : 'Boş'}">${item ? item.count : ''}</div>`;
                }
                invEl.innerHTML = html;
            }
        });

        socket.on('bot-scoreboard', (data) => {
            const titleEl = document.getElementById(`score-title-${data.id}`);
            const itemsEl = document.getElementById(`score-items-${data.id}`);
            if (titleEl && itemsEl) {
                titleEl.innerText = data.scoreboard.title;
                itemsEl.innerHTML = data.scoreboard.items.length > 0 ? data.scoreboard.items.join('<br>') : '<span style="color:#64748b">Veri yok</span>';
            }
        });

        socket.on('stats-update', (data) => {
            for (const id in data.bots) {
                const uptimeEl = document.getElementById(`uptime-${id}`);
                if (uptimeEl) uptimeEl.innerText = data.bots[id].uptime;
            }
        });
    </script>
</body>
</html>
